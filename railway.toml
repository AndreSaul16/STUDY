[build]
builder = "nixpacks"

[build.nixpacks]
nixPkgs = ["python311"]
aptPkgs = ["sqlite3"]
installCmd = "cd backend && pip install -r requirements.txt"

[deploy]
startCmd = "cd backend && uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}"
healthcheckPath = "/health"
restartPolicyMaxRetries = 3

[service]
name = "STUDY"
